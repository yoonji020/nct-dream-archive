<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>SCHEDULE · NCT DREAM ARCHIVE</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <style>
    :root { --orange:#E8642A; --dark:#1a1a1a; --dark2:#222222; --dark3:#2a2a2a; --white:#ffffff; --gray:#aaaaaa; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--dark); color:var(--white); font-family:'Noto Sans KR',sans-serif; cursor:none; overflow-x:hidden; }

    #cursor { width:18px; height:18px; background:var(--orange); border-radius:50%; position:fixed; pointer-events:none; z-index:99999; transform:translate(-50%,-50%); transition:width .2s,height .2s; }
    #cursor-ring { width:40px; height:40px; border:2px solid var(--orange); border-radius:50%; position:fixed; pointer-events:none; z-index:99998; transform:translate(-50%,-50%); transition:all .15s ease; opacity:.5; }

    #header { background:rgba(26,26,26,.92); backdrop-filter:blur(10px); border-bottom:1px solid rgba(232,100,42,.3); position:fixed; top:0; width:100%; z-index:9000; padding:0 40px; height:70px; display:flex; align-items:center; justify-content:space-between; }
    .logo-text { font-family:'Bebas Neue',sans-serif; font-size:28px; color:var(--orange); letter-spacing:2px; line-height:1; text-decoration:none; }
    .logo-text span { display:block; font-size:14px; color:var(--white); letter-spacing:6px; }
    #navbar { position:absolute; left:50%; transform:translateX(-50%); }
    #navbar ul { list-style:none; display:flex; gap:60px; margin:0; padding:0; align-items:center; }
    #navbar ul li a { font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; color:rgba(255,255,255,.7); text-decoration:none; transition:color .3s; position:relative; }
    #navbar ul li a::after { content:''; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:var(--orange); transition:width .3s; }
    #navbar ul li a:hover { color:var(--white); }
    #navbar ul li a.active { color:var(--orange); }
    #navbar ul li a:hover::after, #navbar ul li a.active::after { width:100%; }
    .login-btn { width:38px; height:38px; border-radius:50%; border:2px solid var(--orange); background:transparent; color:var(--white); display:flex; align-items:center; justify-content:center; cursor:none; transition:all .3s; font-size:18px; }
    .login-btn:hover { background:var(--orange); }
    .login-btn i { display:inline-flex; line-height:1; }
    .login-btn i.bi-box-arrow-right { transform:translate(3px,0); }

    .page-wrapper { padding-top:70px; min-height:100vh; }

    
    .page-header {
      padding: 60px 80px 40px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }

    .section-label { font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:6px; color:var(--orange); margin-bottom:12px; }
    .section-heading { font-family:'Bebas Neue',sans-serif; font-size:56px; color:var(--white); letter-spacing:4px; line-height:1; }

    
    .month-nav {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .month-nav-btn {
      width: 36px; height: 36px;
      background: transparent;
      border: 1px solid rgba(255,255,255,.2);
      color: var(--white);
      display: flex; align-items: center; justify-content: center;
      cursor: none;
      transition: all 0.3s;
      font-size: 16px;
    }

    .month-nav-btn:hover { border-color: var(--orange); color: var(--orange); }

    .month-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px;
      letter-spacing: 4px;
      color: var(--white);
      min-width: 180px;
      text-align: center;
    }

    
    .calendar-wrapper {
      padding: 0 80px 80px;
    }

    
    .calendar-header {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 8px;
    }

    .calendar-header-cell {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      text-align: center;
      padding: 12px 0;
      color: var(--gray);
      min-width: 0;
    }

    .calendar-header-cell:first-child { color: #ff6b6b; }
    .calendar-header-cell:last-child { color: #6b9fff; }

    
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
    }

    .calendar-cell {
      min-height: 110px;
      background: var(--dark2);
      padding: 10px;
      position: relative;
      transition: background 0.2s;
      min-width: 0;
      overflow: hidden;
    }

    .calendar-cell:hover { background: var(--dark3); }

    .calendar-cell.other-month { opacity: 0.3; }

    .calendar-cell.today { border: 1px solid var(--orange); }

    .date-num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      color: var(--gray);
      margin-bottom: 6px;
    }

    .calendar-cell.today .date-num {
      color: var(--orange);
    }

    .calendar-cell.sunday .date-num { color: #ff6b6b; }
    .calendar-cell.saturday .date-num { color: #6b9fff; }

    
    .schedule-item {
      font-size: 11px;
      padding: 3px 7px;
      margin-bottom: 3px;
      border-radius: 2px;
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: none;
      transition: opacity 0.2s;
    }

    .schedule-item:hover { opacity: 0.8; }

    .schedule-item.type-concert { background: rgba(232,100,42,.8); color: #fff; }
    .schedule-item.type-release { background: rgba(107,159,255,.8); color: #fff; }
    .schedule-item.type-broadcast { background: rgba(107,255,159,.8); color: #111; }
    .schedule-item.type-fanmeet { background: rgba(255,107,200,.8); color: #fff; }

    
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--gray);
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 2px;
    }

    
    #login-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:99000; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
    #login-modal.open { display:flex; }
    .modal-box { background:var(--dark2); border:1px solid rgba(232,100,42,.3); padding:60px 50px; width:700px; max-width:95vw; position:relative; }
    .modal-close { position:absolute; top:20px; right:24px; background:none; border:none; color:var(--white); font-size:24px; cursor:none; transition:color .3s; }
    .modal-close:hover { color:var(--orange); }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:48px; letter-spacing:6px; text-align:center; margin-bottom:8px; }
    .modal-subtitle { text-align:center; color:var(--gray); font-size:13px; letter-spacing:2px; margin-bottom:48px; }
    .member-grid { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; }
    .member-card { display:flex; flex-direction:column; align-items:center; gap:10px; cursor:none; transition:transform .3s; }
    .member-card:hover { transform:translateY(-6px); }
    .member-avatar { width:80px; height:80px; border-radius:50%; border:3px solid transparent; background:var(--dark3); display:flex; align-items:center; justify-content:center; font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--gray); transition:border-color .3s; }
    .member-card:hover .member-avatar, .member-card.selected .member-avatar { border-color:var(--orange); }
    .member-card.selected .member-name { color:var(--orange); }
    .member-name { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:2px; color:var(--white); transition:color .3s; }
    .modal-confirm { display:block; margin:40px auto 0; background:var(--orange); color:var(--white); font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:3px; padding:14px 48px; border:none; cursor:none; transition:background .3s; }
    .modal-confirm:hover { background:#c9551f; }
  </style>
</head>
<body>
  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <header id="header">
    <a href="index.html" class="logo-text">NCT<span>DREAM</span></a>
    <nav id="navbar">
      <ul>
        <li><a href="index.html#about">ABOUT</a></li>
        <li><a href="members.html">MEMBERS</a></li>
        <li><a href="albums.html">ALBUMS</a></li>
        <li><a href="contents.html">CONTENTS</a></li>
        <li><a href="schedule.html" class="active">SCHEDULE</a></li>
      </ul>
    </nav>
    <button class="login-btn" id="login-open-btn"><i class="bi bi-person"></i></button>
  </header>

  <div class="page-wrapper">
    <div class="page-header">
      <div>
        <p class="section-label">ACTIVITY</p>
        <h1 class="section-heading">SCHEDULE</h1>
      </div>
      <div class="month-nav">
        <button class="month-nav-btn" id="prevBtn"><i class="bi bi-chevron-left"></i></button>
        <div class="month-label" id="monthLabel"></div>
        <button class="month-nav-btn" id="nextBtn"><i class="bi bi-chevron-right"></i></button>
      </div>
    </div>

    <div class="calendar-wrapper">
      
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:rgba(232,100,42,.8)"></div>콘서트/공연</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(107,159,255,.8)"></div>음반 발매</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(107,255,159,.8)"></div>방송/출연</div>
        <div class="legend-item"><div class="legend-dot" style="background:rgba(255,107,200,.8)"></div>팬미팅</div>
      </div>

      
      <div class="calendar-header">
        <div class="calendar-header-cell">SUN</div>
        <div class="calendar-header-cell">MON</div>
        <div class="calendar-header-cell">TUE</div>
        <div class="calendar-header-cell">WED</div>
        <div class="calendar-header-cell">THU</div>
        <div class="calendar-header-cell">FRI</div>
        <div class="calendar-header-cell">SAT</div>
      </div>

      
      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  
  <div id="login-modal">
    <div class="modal-box">
      <button class="modal-close" id="login-close-btn">✕</button>
      <h2 class="modal-title">LOGIN</h2>
      <p class="modal-subtitle">최애 멤버를 선택하세요</p>
      <div class="member-grid">
        <div class="member-card" data-member="renjun" onclick="selectMember(this)"><div class="member-avatar">RJ</div><span class="member-name">RENJUN</span></div>
        <div class="member-card" data-member="jeno" onclick="selectMember(this)"><div class="member-avatar">JN</div><span class="member-name">JENO</span></div>
        <div class="member-card" data-member="haechan" onclick="selectMember(this)"><div class="member-avatar">HC</div><span class="member-name">HAECHAN</span></div>
        <div class="member-card" data-member="jaemin" onclick="selectMember(this)"><div class="member-avatar">JM</div><span class="member-name">JAEMIN</span></div>
        <div class="member-card" data-member="chenle" onclick="selectMember(this)"><div class="member-avatar">CL</div><span class="member-name">CHENLE</span></div>
        <div class="member-card" data-member="jisung" onclick="selectMember(this)"><div class="member-avatar">JS</div><span class="member-name">JISUNG</span></div>
      </div>
      <button class="modal-confirm" id="modal-confirm-btn">SELECT</button>
    </div>
  </div>

  <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script>
    const cursor = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursor-ring');
    document.addEventListener('mousemove', (e) => {
      cursor.style.left = e.clientX + 'px'; cursor.style.top = e.clientY + 'px';
      cursorRing.style.left = e.clientX + 'px'; cursorRing.style.top = e.clientY + 'px';
    });
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => {
        if (cursor.style.backgroundImage) {
          cursor.style.width = '50px';
          cursor.style.height = '50px';
        } else {
          cursor.style.width = '28px';
          cursor.style.height = '28px';
          cursorRing.style.width = '55px';
          cursorRing.style.height = '55px';
        }
      });
      el.addEventListener('mouseleave', () => {
        if (cursor.style.backgroundImage) {
          cursor.style.width = '40px';
          cursor.style.height = '40px';
        } else {
          cursor.style.width = '18px';
          cursor.style.height = '18px';
          cursorRing.style.width = '40px';
          cursorRing.style.height = '40px';
        }
      });
    });

    
    const schedules = {
      '2026-06-07': [{ text: 'NCT DREAM 팬미팅', type: 'fanmeet' }],
      '2026-06-14': [{ text: '음반 발매', type: 'release' }],
      '2026-06-20': [{ text: '음악방송 출연', type: 'broadcast' }],
      '2026-06-21': [{ text: '음악방송 출연', type: 'broadcast' }],
      '2026-06-28': [{ text: 'THE DREAM SHOW3', type: 'concert' }],
      '2026-06-29': [{ text: 'THE DREAM SHOW3', type: 'concert' }],
      '2026-07-05': [{ text: '팬사인회', type: 'fanmeet' }],
      '2026-07-12': [{ text: '새 앨범 발매', type: 'release' }],
      '2026-07-17': [{ text: '음악방송 출연', type: 'broadcast' }],
    };

    
    const today = new Date();
    let currentYear = today.getFullYear();
    let currentMonth = today.getMonth();

    const MONTHS_KO = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];

    function pad(n) { return String(n).padStart(2, '0'); }

    function renderCalendar(year, month) {
      document.getElementById('monthLabel').textContent = `${MONTHS_KO[month]} ${year}`;

      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();
      const prevLastDate = new Date(year, month, 0).getDate();

      let cells = [];

      
      for (let i = firstDay - 1; i >= 0; i--) {
        cells.push({ day: prevLastDate - i, type: 'other' });
      }
      
      for (let d = 1; d <= lastDate; d++) {
        cells.push({ day: d, type: 'current' });
      }
      
      const remaining = 42 - cells.length;
      for (let d = 1; d <= remaining; d++) {
        cells.push({ day: d, type: 'other' });
      }

      cells.forEach((cell, idx) => {
        const div = document.createElement('div');
        div.className = 'calendar-cell';

        const dayOfWeek = idx % 7;
        if (dayOfWeek === 0) div.classList.add('sunday');
        if (dayOfWeek === 6) div.classList.add('saturday');
        if (cell.type === 'other') div.classList.add('other-month');

        
        if (cell.type === 'current' &&
            cell.day === today.getDate() &&
            year === today.getFullYear() &&
            month === today.getMonth()) {
          div.classList.add('today');
        }

        const dateNum = document.createElement('div');
        dateNum.className = 'date-num';
        dateNum.textContent = cell.day;
        div.appendChild(dateNum);

        
        if (cell.type === 'current') {
          const dateKey = `${year}-${pad(month + 1)}-${pad(cell.day)}`;
          const daySchedules = schedules[dateKey] || [];
          daySchedules.forEach(s => {
            const item = document.createElement('div');
            item.className = `schedule-item type-${s.type}`;
            item.textContent = s.text;
            div.appendChild(item);
          });
        }

        grid.appendChild(div);
      });
    }

    
    document.getElementById('prevBtn').addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) { currentMonth = 11; currentYear--; }
      renderCalendar(currentYear, currentMonth);
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) { currentMonth = 0; currentYear++; }
      renderCalendar(currentYear, currentMonth);
    });

    renderCalendar(currentYear, currentMonth);

    const modal = document.getElementById('login-modal');
    document.getElementById('login-open-btn').addEventListener('click', () => {
      const saved = localStorage.getItem('ncd-member');
      if (saved) {
        localStorage.removeItem('ncd-member');
        const cursor = document.getElementById('cursor');
        const cursorRing = document.getElementById('cursor-ring');
        if (cursor) {
          cursor.style.backgroundImage = '';
          cursor.style.backgroundColor = 'var(--orange)';
          cursor.style.borderRadius = '50%';
          cursor.style.width = '18px';
          cursor.style.height = '18px';
        }
        if (cursorRing) {
          cursorRing.style.display = 'block';
          cursorRing.style.width = '40px';
          cursorRing.style.height = '40px';
        }
        document.querySelectorAll('.member-card').forEach(c => c.classList.remove('selected'));
        updateLoginButtonState();
        alert('로그아웃되었습니다!');
      } else {
        modal.classList.add('open');
      }
    });
    document.getElementById('login-close-btn').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if(e.target===modal) modal.classList.remove('open'); });
    let selectedMember = localStorage.getItem('ncd-member') || 'renjun';
    function selectMember(card) {
      document.querySelectorAll('.member-card').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected'); selectedMember = card.dataset.member;
    }
    document.getElementById('modal-confirm-btn').addEventListener('click', () => {
      localStorage.setItem('ncd-member', selectedMember);
      modal.classList.remove('open');
      applyCursor(selectedMember);
      updateLoginButtonState();
      alert(selectedMember.toUpperCase() + ' 으로 로그인되었습니다!');
    });
    function applyCursor(member) {
      if (member) {
        const cursor = document.getElementById('cursor');
        const cursorRing = document.getElementById('cursor-ring');
        if (cursor) {
          cursor.style.backgroundImage = `url('assets/img/cursor-${member}.png')`;
          cursor.style.backgroundSize = 'contain';
          cursor.style.backgroundPosition = 'center';
          cursor.style.backgroundRepeat = 'no-repeat';
          cursor.style.backgroundColor = 'transparent';
          cursor.style.borderRadius = '0';
          cursor.style.width = '40px';
          cursor.style.height = '40px';
        }
        if (cursorRing) {
          cursorRing.style.display = 'none';
        }
      }
    }
    function updateLoginButtonState() {
      const loginBtn = document.getElementById('login-open-btn');
      const saved = localStorage.getItem('ncd-member');
      if (saved) {
        loginBtn.innerHTML = '<i class="bi bi-box-arrow-right"></i>';
      } else {
        loginBtn.innerHTML = '<i class="bi bi-person"></i>';
      }
    }
    const saved = localStorage.getItem('ncd-member');
    if(saved) {
      const card = document.querySelector('[data-member="'+saved+'"]');
      if(card) selectMember(card);
      applyCursor(saved);
    }
    updateLoginButtonState();
  </script>
</body>
</html>
